version = 1
requires-python = ">=3.12"

[[package]]
name = "math-tools"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "windows-curses", marker = "sys_platform == 'windows'" },
]

[package.metadata]
requires-dist = [{ name = "windows-curses", marker = "sys_platform == 'windows'", specifier = ">=2.4.1" }]

[[package]]
name = "windows-curses"
version = "2.4.1"
source = { registry = "https://pypi.org/simple" }
